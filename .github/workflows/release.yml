# Release automation: build + publish the pinned scanner image.
#
# Triggered by pushing a `release-*` tag. Builds for amd64 and arm64
# and pushes ghcr.io/pepbunny/zoltra-opengrep-sast:<tag> with the
# repo-scoped GITHUB_TOKEN (no personal credential involved).
# The published digest is then pinned into the Zoltra managed
# workflow + release manifest (see the Zoltra monorepo).

name: Release scanner image

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/pepbunny/zoltra-opengrep-sast:${{ github.ref_name }}

      - name: Report digest
        run: echo "image_digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
